<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — Siteviral</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117; color: #e6edf3;
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 1.5rem; text-align: center;
    }
    .container { max-width: 360px; }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 1.5rem;
      background: rgba(212,146,10,.15); border-radius: 1.25rem;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; color: #d4920a; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: .5rem; }
    p { font-size: .875rem; color: #8b949e; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      background: #d4920a; color: #0d1117; border: none;
      padding: .75rem 2rem; border-radius: .75rem;
      font-size: .875rem; font-weight: 700; cursor: pointer;
      transition: opacity .2s;
    }
    button:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M15.536 8.464a5 5 0 010 7.072M2 2l20 20"/>
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion internet puis réessayez. Les pages déjà visitées restent accessibles.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
